schema_version: 0.1
backend: metal
status_values:
  - implemented
  - partial
  - experimental
  - planned
  - unsupported
  - capability_gated
layout: canonical
families:
  norms:
    status: implemented
    paths:
      - kernels/norms/rms_norm
      - kernels/norms/rms_norm_residual_next
      - kernels/norms/layernorm
      - kernels/norms/add_norm
      - kernels/norms/qk_norm_rope
  activations:
    status: implemented
    paths:
      - kernels/activations/gelu
      - kernels/activations/glu
      - kernels/activations/softmax
  attention:
    status: implemented
    paths:
      - kernels/attention/attn_fwd
      - kernels/attention/attn_fwd_sg
      - kernels/attention/attn_bwd
      - kernels/attention/attn_causal
      - kernels/attention/attn_decode
      - kernels/attention/attn_multiwarp
      - kernels/attention/attn_varlen
      - kernels/attention/attn_q
      - kernels/attention/paged_attn_v2
      - kernels/attention/mla
      - kernels/attention/rotary
      - kernels/attention/rope_kv
      - kernels/attention/swin_attn
  linear_attention:
    status: implemented
    paths:
      - kernels/linear_attention/based
      - kernels/linear_attention/hedgehog
      - kernels/linear_attention/linear_attn
      - kernels/linear_attention/lin_attn_causal
      - kernels/linear_attention/lin_attn_decay
      - kernels/linear_attention/gdn
  ssm:
    status: implemented
    paths:
      - kernels/ssm/mamba2
      - kernels/ssm/selective_scan
      - kernels/ssm/fftconv
  matmul:
    status: implemented
    paths:
      - kernels/matmul/matmul_custom
      - kernels/matmul/gemm_staged
      - kernels/matmul/gemm_v3
      - kernels/matmul/cmplx_matmul
      - kernels/matmul/flux
      - kernels/matmul/decode_linear
  quantization:
    status: implemented
    paths:
      - kernels/quantization/act_quant
      - kernels/quantization/fake_quant
      - kernels/quantization/fake_quant_fp8
      - kernels/quantization/quant_rt
      - kernels/quantization/quantize_tq2_0
      - kernels/quantization/weight_quant_ternary
      - kernels/quantization/ternary_stats
      - kernels/quantization/qgemm
      - kernels/quantization/qgemm_bwd
      - kernels/quantization/qgemm_fused
      - kernels/quantization/qgemm_int
      - kernels/quantization/qgemv
      - kernels/quantization/qgemv_fused
      - kernels/quantization/qgemv_int
      - kernels/quantization/qflux
      - kernels/quantization/lm_head
      - kernels/quantization/dequant_gather
      - kernels/quantization/turboquant
  vision:
    status: implemented
    paths:
      - kernels/vision/patch_merge
      - kernels/vision/edge_mlp
  moe:
    status: implemented
    paths:
      - kernels/moe/moe
  sampling:
    status: implemented
    paths:
      - kernels/sampling/sampling
  serving:
    status: implemented
    paths:
      - kernels/serving/kv_cache
      - kernels/serving/indexer
      - kernels/serving/minference
      - kernels/serving/embedding
      - kernels/serving/mean_pool_rms_l2
  optimizers:
    status: implemented
    paths:
      - kernels/optimizers/optim
  collectives:
    status: planned
    paths: []
  utils:
    status: implemented
    paths:
      - kernels/utils/hadamard
      - kernels/utils/kd_kl_topk
      - kernels/utils/kd_kl_dense
      - kernels/utils/marginal
      - kernels/utils/add_rt
      - kernels/utils/dropout
      - kernels/utils/cross_entropy
operations:
  quantized_embedding:
    family: quantization
    status: implemented
    path: kernels/quantization/dequant_gather
    bindings:
      mlx: bindings/python/bindings.cpp
      pytorch_mps: bindings/pytorch_mps/tk_torch/torch_kernels.mm
    tests: tests/correctness/quantization/dequant_gather
    benchmark: quantized_embedding
  quantized_embedding_bag:
    family: quantization
    status: implemented
    path: kernels/quantization/dequant_gather
    bindings:
      mlx: bindings/python/bindings.cpp
      pytorch_mps: bindings/pytorch_mps/tk_torch/torch_kernels.mm
    tests: tests/correctness/quantization/dequant_gather
    benchmark: quantized_embedding_bag
  decode_linear_epilogue:
    family: matmul
    status: implemented
    path: kernels/matmul/decode_linear
    bindings:
      mlx: bindings/python/bindings.cpp
      pytorch_mps: bindings/pytorch_mps/tk_torch/torch_kernels.mm
    tests: tests/correctness/matmul/decode_linear
    benchmark: decode_linear_epilogue
  decode_swiglu:
    family: matmul
    status: implemented
    path: kernels/matmul/decode_linear
    bindings:
      mlx: bindings/python/bindings.cpp
      pytorch_mps: bindings/pytorch_mps/tk_torch/torch_kernels.mm
    tests: tests/correctness/matmul/decode_linear
    benchmark: decode_swiglu
  lm_head_masked:
    family: quantization
    status: implemented
    path: kernels/quantization/lm_head
    bindings:
      mlx: bindings/python/bindings.cpp
      pytorch_mps: bindings/pytorch_mps/tk_torch/torch_kernels.mm
    tests: tests/correctness/quantization/lm_head
    benchmark: lm_head_masked
  lm_head_candidates:
    family: quantization
    status: implemented
    path: kernels/quantization/lm_head
    bindings:
      mlx: bindings/python/bindings.cpp
      pytorch_mps: bindings/pytorch_mps/tk_torch/torch_kernels.mm
    tests: tests/correctness/quantization/lm_head
    benchmark: lm_head_candidates
  lm_head_beam_advance:
    family: quantization
    status: implemented
    path: kernels/quantization/lm_head
    bindings:
      mlx: bindings/python/bindings.cpp
      pytorch_mps: bindings/pytorch_mps/tk_torch/torch_kernels.mm
    tests: tests/correctness/quantization/lm_head
    benchmark: lm_head_beam
  edge_mlp_256x7:
    family: vision
    status: implemented
    path: kernels/vision/edge_mlp
    bindings:
      mlx: bindings/python/bindings.cpp
      pytorch_mps: bindings/pytorch_mps/tk_torch/torch_kernels.mm
    tests: tests/correctness/vision/edge_mlp
    benchmark: edge_mlp
  space_to_depth_norm_linear:
    family: vision
    status: implemented
    path: kernels/vision/patch_merge
    bindings:
      mlx: bindings/python/bindings.cpp
      pytorch_mps: bindings/pytorch_mps/tk_torch/torch_kernels.mm
    tests: tests/correctness/vision/patch_merge
    benchmark: space_to_depth_norm_linear
  decode_cache_attention:
    family: attention
    status: implemented
    path: kernels/attention/attn_decode
    bindings:
      mlx: bindings/python/bindings.cpp
      pytorch_mps: bindings/pytorch_mps/tk_torch/torch_kernels.mm
    tests: tests/correctness/attention/attn_decode
    benchmark: decode_cache_attention
  attn_decode_bh:
    family: attention
    status: implemented
    path: kernels/attention/attn_decode
    bindings:
      mlx: bindings/python/bindings.cpp
      pytorch_mps: bindings/pytorch_mps/tk_torch/torch_kernels.mm
    tests: tests/correctness/attention/attn_decode
    benchmark: attn_decode_bh
  attn_fwd_sg_d256:
    family: attention
    status: implemented
    path: kernels/attention/attn_fwd_sg
    notes: simdgroup_matrix flash attention for head_dim=256, GQA, f32 Q/O, and f16 K/V.
    bindings:
      mlx: bindings/python/bindings.cpp
      pytorch_mps: bindings/pytorch_mps/tk_torch/torch_kernels.mm
    tests: bindings/pytorch_mps/tests/test_mps.py::test_attn_fwd_sg_d256
    benchmark: attn_fwd_sg
  mean_pool_rms_l2:
    family: serving
    status: implemented
    path: kernels/serving/mean_pool_rms_l2
    notes: BF16 embedding mean-pool followed by RMS/L2 normalization for D in 256/512/768/1024.
    bindings:
      mlx: bindings/python/bindings.cpp
      pytorch_mps: bindings/pytorch_mps/tk_torch/torch_kernels.mm
    tests: bindings/pytorch_mps/tests/test_mps.py::test_mean_pool_rms_l2
    benchmark: mean_pool_rms_l2
  rms_norm_residual_next:
    family: norms
    status: implemented
    path: kernels/norms/rms_norm_residual_next
    notes: Fuses post-RMSNorm residual add with the next-block pre-RMSNorm.
    bindings:
      mlx: bindings/python/bindings.cpp
      pytorch_mps: bindings/pytorch_mps/tk_torch/torch_kernels.mm
    tests: bindings/pytorch_mps/tests/test_mps.py::test_rms_norm_residual_next
    benchmark: rms_norm_residual_next
  qk_norm_rope_kv_f16:
    family: norms
    status: implemented
    path: kernels/norms/qk_norm_rope
    notes: qk_norm_rope variant that split-stores Q as BF16 and K/V as FP16.
    bindings:
      mlx: bindings/python/bindings.cpp
      pytorch_mps: bindings/pytorch_mps/tk_torch/torch_kernels.mm
    tests: bindings/pytorch_mps/tests/test_mps.py::test_qk_norm_rope_kv_f16
    benchmark: qk_norm_rope_kv_f16
  qgemv_q4_0_f32_up_gate_gelu:
    family: quantization
    status: implemented
    path: kernels/quantization/qgemv_fused
    notes: Fused Q4_0 decode GEMV for gelu_tanh(gate @ x) * (up @ x) with fp32 activation.
    bindings:
      pytorch_mps: bindings/pytorch_mps/tk_torch/torch_kernels.mm
    tests: bindings/pytorch_mps/tests/test_mps.py::test_qgemv_q4_0_f32_up_gate_gelu
    benchmark: qgemv_fused
  qgemv_q4_0_f32_up_gate:
    family: quantization
    status: implemented
    path: kernels/quantization/qgemv_fused
    notes: Fused Q4_0 decode GEMV producing up and gate projections from one fp32 activation stream.
    bindings:
      pytorch_mps: bindings/pytorch_mps/tk_torch/torch_kernels.mm
    tests: bindings/pytorch_mps/tests/test_mps.py::test_qgemv_q4_0_f32_up_gate
    benchmark: qgemv_fused
  qgemv_q4_0_f32_qkv:
    family: quantization
    status: implemented
    path: kernels/quantization/qgemv_fused
    notes: Fused Q4_0 decode GEMV for GQA-friendly Q/K/V projections from one fp32 activation stream.
    bindings:
      pytorch_mps: bindings/pytorch_mps/tk_torch/torch_kernels.mm
    tests: bindings/pytorch_mps/tests/test_mps.py::test_qgemv_q4_0_f32_qkv
    benchmark: qgemv_fused
notes: Canonical family manifest with operation-level metadata for specialized composed kernels.
